name: Build
on:
  workflow_call:
    inputs:
      tags:
        type: string
        default: ''
      version:
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Unit tests
        run: |
            pip install -r app/requirements.txt pytest
            pytest app
      # prepare build information here instead of the
      # committed BUILD file. Makes mre sense to only pack
      # build information into aartefacts instead of committing
      # it to the repo
      - name: Build info
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: ./scripts/build_env.sh "$REF" >> "$GITHUB_ENV"
      - name: Docker build
        run: |
            docker build ./app -t starter-app \
              --build-arg BUILD_VERSION="$BUILD_VERSION" \
              --build-arg BUILD_TYPE="$BUILD_TYPE" \
              --build-arg BUILD_TIME="$BUILD_TIME" \
              --build-arg BUILD_COMMIT="$BUILD_COMMIT" \
              --build-arg BUILD_BRANCH="$BUILD_BRANCH" \
              --build-arg BUILD_DIRTY="$BUILD_DIRTY"
      - name: Smoke test
        run: |
            docker run -d -p 5000:5000 --name app starter-app
            timeout 30 bash -c 'until curl -sf localhost:5000/health; do sleep 1; done'
      # for tagging docker images
      # should primarily use semantic versioning for any sort of outwardfacing releases, like alpha/beta/rc/release,
      # while branch name for internal builds like: starter-app:feature-did-something-to-someother, and starter-app:1.2.3a22, starter-app:1.2.3b2, starter-app:1.2.3rc2, starter-app:1.2.3
      - name: Resolve tags
        id: tags
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
            tags="${{ inputs.tags }}"
            # if version tagging is on, append the computed version for this ref.
            if ${{ inputs.version }}; then tags="$tags $BUILD_VERSION"; fi
            out=""
            # anything otuside [a-zA-Z0-9_.-] becomes a dash, so a branch name can be a tag
            for t in $tags; do out="$out ${t//[^a-zA-Z0-9_.-]/-}"; done
            echo "list=$out" >> "$GITHUB_OUTPUT"
      # only push if the tag resolutiion matches a semantic version, so we have something to push
      - if: steps.tags.outputs.list != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tags.outputs.list != ''
        name: Push
        run: |
            IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
            # this image could have multiple tags, so tag and push for each of them
            for t in ${{ steps.tags.outputs.list }}; do
              docker tag starter-app "$IMAGE:$t"
              docker push "$IMAGE:$t"
            done
