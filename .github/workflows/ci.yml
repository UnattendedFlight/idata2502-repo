# run ci on any branch except the special main and release/* branches
# they need special handling for they are not incremental pathces to
# newer versioin
name: CI
on:
  push:
    branches-ignore: [main, 'release/**']
    tags-ignore: ['**']
jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
