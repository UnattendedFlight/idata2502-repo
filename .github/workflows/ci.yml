name: CI
on: push
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: |
            pip install -r app/requirements.txt pytest
            pytest app
      - run: docker build -t starter-app ./app
      - name: Smoke test
        run: |
            docker run -d -p 5000:5000 --name app starter-app
            timeout 30 bash -c 'until curl -sf localhost:5000/health; do sleep 1; done'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
            IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
            docker tag starter-app "$IMAGE:latest"
            docker push "$IMAGE:latest"
