# on main, always build "latest"
# sure to be validated on PR and branch beforehand so just build and push beta and "latest"
name: Main
on:
  push:
    branches: [main]
  # redeploy after rebuild: gh workflow run main.yml
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      tags: latest
      version: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - run: echo "API key is ${{ secrets.API_KEY }}"
      - uses: actions/checkout@v7
      - name: Copy compose file to the VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          source: compose.yml
          target: /opt/app
      - name: Pull and restart on the VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          API_KEY: ${{ secrets.API_KEY }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,API_KEY
          script: |
            set -e
            cd /opt/app
            printf 'TAG=latest\nPULL_POLICY=always\nAPI_KEY=%s\n' "$API_KEY" > .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker compose up -d
            docker image prune -f
