
services:
  app:
    # pull policy chooses between local build and remote registry
    # if its "build" the local build will be used
    # and if "always", pulls the remote image for the given tag
    # prefer to use "./scripts/compose.sh up"
    # or
    # "TAG=chore-improved-build-information ./scripts/compose.sh up"
    # (for pulling and running remote registry image)
    image: ghcr.io/unattendedflight/idata2502-repo:${TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ./app # build from local app dir
      # exported by scripts/compose.sh
      args:
        BUILD_VERSION: ${BUILD_VERSION:-debug}
        BUILD_TYPE: ${BUILD_TYPE:-debug}
        BUILD_TIME: ${BUILD_TIME:-debug}
        BUILD_COMMIT: ${BUILD_COMMIT:-debug}
        BUILD_BRANCH: ${BUILD_BRANCH:-debug}
        BUILD_DIRTY: ${BUILD_DIRTY:-debug}
    # id rather be explicit, so if the service name is changed or suffixed, like -prod, -dev, -staging,
    # internal compose hostnames remains the same
    hostname: app
    ports:
      - 5001:5000
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:8.8.2-alpine # alpine for low footprint base platform and pin redis app to 8.8.2
    hostname: redis # same explicit hostname
    ports:
      - 6379:6379 # redis service port
    volumes:
      - redis-data:/data
    # app depends on redis being healthy for its functionality, so the docker serivce must be able to report its own health.
    # cli tool allows this using ping and checking whether it returns "PONG"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped # ensures redis always tries to start until it is manualy stopped

volumes:
  redis-data: # no driver opts, just a docker volujme
