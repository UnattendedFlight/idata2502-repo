---
# The finished week 7 playbook. Four things shall be true on the server after
# ONE run; the SECOND run reports changed=0 because every module checks before
# it acts. Runs unchanged against the real VM in week 9.
#
# Module docs: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/

- name: Configure the app server
  hosts: app
  become: true

  tasks:
    - name: Leave a note for anyone who logs in
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          This server is managed by Ansible - change the playbook, not the machine.
        mode: "0644"       # /etc/motd is shown at every SSH login

    - name: Install Docker and the compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600 # without this: apt updates - and reports changed - on every run

    - name: Let ubuntu run docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true # without this the user's OTHER groups are removed - including sudo

    - name: Ensure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true # started = now, enabled = also after a reboot
