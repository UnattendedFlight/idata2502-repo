---
# Main playbook - you write the tasks during the week 7 lab.
# Goal: after ONE run, a fresh server is ready to run your containers -
# the lab server (week 7) and, unchanged, the real VM (week 9).
# After a SECOND run, the recap shows changed=0 (idempotence - that is
# the proof the lab asks for).
#
# Write ONE task, run the playbook, then the next - the same rhythm as the
# Terraform lab. Module docs:
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/

- name: Configure the app server
  hosts: app
  become: true
  gather_facts: false

  tasks:
    - name: Wait for the VM to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Create the message of the day
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          lab-server: managed by Ansible from github.com/UnattendedFlight/idata2502-repo - manual changes are overwritten.
        mode: "0644"

    - name: Add docker and compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600 # 1 hour cache to avoid frequent updates

    - name: Group add for docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Make sure docker starts on boot and starts now
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the app dir
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/copy_module.html
    - name: Copy compose file over
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yml"
        dest: /opt/app/compose.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Authorize the GitHub Actions deploy key
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ lookup('file', '~/.ssh/idata2502_deploy.pub') }}"

    - name: Key-only SSH, no root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          PermitRootLogin no
        mode: "0644"
      notify: Restart ssh

    # 1 GB RAM is not really inough for the monitoring stack
    # so add a swap file as a safety buffer to avoid oom issues
    - name: Create a 1 GB swap file
      ansible.builtin.command: fallocate -l 1G /swapfile
      args: { creates: /swapfile }

    - name: Swap file permisssions
      ansible.builtin.file: { path: /swapfile, mode: "0600" }

    - name: Enable swap
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Enable swap on boot
      ansible.builtin.lineinfile: { path: /etc/fstab, line: "/swapfile none swap sw 0 0" }

    - name: Copy the monitoring stack
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring"
        dest: /opt/app/
        owner: ubuntu
        group: ubuntu

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
