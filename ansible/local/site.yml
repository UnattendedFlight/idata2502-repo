---
# Main playbook - you write the tasks during the week 7 lab.
# Goal: after ONE run, a fresh server is ready to run your containers -
# the lab server (week 7) and, unchanged, the real VM (week 9).
# After a SECOND run, the recap shows changed=0 (idempotence - that is
# the proof the lab asks for).
#
# Write ONE task, run the playbook, then the next - the same rhythm as the
# Terraform lab. Module docs:
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/

- name: Configure the app server
  hosts: app
  become: true

  tasks:
    - name: Create the message of the day
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          Hello IDATA2502, ansible manages this shi
        mode: "0644"

    - name: Add docker and compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600 # 1 hour cache to avoid frequent updates

    - name: Group add for docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # TODO 4 (week 7): make sure the Docker service is running - and comes
    #   back after a reboot.

    # TODO (week 9, recommended): put your compose.yaml on the server as
    #   part of this playbook. Then the CD job only has to run
    #   `docker compose pull && up -d` - and the file on the server can never
    #   drift from the one in the repo.

    - name: Placeholder - remove me when you add real tasks
      ansible.builtin.debug:
        msg: "Ansible reaches the server. Now write the real tasks (see TODOs above)."
